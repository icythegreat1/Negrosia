<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | Negrosia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">NEGROSIA</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="seller.html">Dashboard</a>
        </div>

        <div class="nav-actions">
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <section class="register-section">

        <div class="register-box">

            <h1>Add Product</h1>
            <p>Add a handmade craft to your Negrosia shop.</p>

           <form action="/add-product" method="POST" enctype="multipart/form-data">

                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    name="productName"
                    placeholder="Enter product name"
                    required
                >

                <label for="category">Category</label>
                <select id="category" name="category" required>

                    <option value="">Select category</option>
                    <option value="Woven Crafts">Woven Crafts</option>
                    <option value="Jewelry & Accessories">Jewelry & Accessories</option>
                    <option value="Home Decor">Home Decor</option>
                    <option value="Bags & Pouches">Bags & Pouches</option>
                    <option value="Handmade Gifts">Handmade Gifts</option>
                    <option value="Souvenirs">Souvenirs</option>

                </select>

                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe your product"
                    rows="5"
                ></textarea>

                <label for="price">Price</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="Enter price"
                    min="0.01"
                    step="0.01"
                    required
                >
                <label for="stock">Stock Quantity</label>
<input
    type="number"
    id="stock"
    name="stock"
    placeholder="Enter available quantity"
    min="0"
    required
>
<label for="productImage">Product Image</label>

<input
    type="file"
    id="productImage"
    name="productImage"
    accept="image/jpeg, image/png, image/webp"
    required
>
                <button type="submit">Add Product</button>

            </form>

        </div>

    </section>

</body>
</html>
